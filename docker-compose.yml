# Local stack: API + Postgres + Redis.
#   docker compose up --build
#   docker compose run --rm migrate      # (runs automatically before api)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kts
      POSTGRES_PASSWORD: kts
      POSTGRES_DB: kts
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kts"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment: &app_env
      DATABASE_URL: postgresql://kts:kts@db:5432/kts
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    env_file: [.env]
    environment: *app_env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  pgdata:
