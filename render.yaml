# Render does not currently offer a Mumbai region. Singapore is the nearest
# available region; use an India-region provider if in-country residency is mandatory.
services:
  - type: web
    name: kts-api-staging
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kts-postgres-staging
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_DEV_STUB
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-credentials.json
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: kts-postgres-staging
    plan: basic-256mb
    region: singapore
    databaseName: kts
    user: kts
    postgresMajorVersion: "16"
    ipAllowList: []
